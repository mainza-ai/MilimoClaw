      test: ["CMD", "python3", "-c", "import os; p = os.path.expanduser('~/.openclaw/milimo/mesh/heartbeats/assistant.json'); assert os.path.exists(p), 'no heartbeat'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
