# Milimo Claw — Docker Compose (DEPRECATED)
#
# WARNING: This docker-compose file is DEPRECATED and UNSUPPORTED.
# It bypasses NemoClaw's isolation — no OpenShell gateway, no policy
# presets, no credential injection at the L7 proxy, no Landlock
# enforcement via nemoclaw onboard.
#
# The ONLY supported deployment path is:
#   ./install.sh --solo --operator-name "name" --squad-name "squad"
#
# This runs nemoclaw onboard --from which bakes MilimoClaw into a
# NemoClaw sandbox image with full isolation (Landlock + seccomp +
# netns + policy engine + gateway credential injection).
#
# This file is retained for reference only. Do not use in production.

x-security: &security
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true
  ulimits:
    nproc:
      soft: 512
      hard: 512

services:
  # ---------------------------------------------------------------------------
  # Build Claw — Code generation, PR management, deployment
  # ---------------------------------------------------------------------------
  build-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-build-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - BUILD_CLAW_NVIDIA_API_KEY=${BUILD_CLAW_NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - VERCEL_TEAM_ID=${VERCEL_TEAM_ID:-}
      - VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:-}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG:-}
      - SENTRY_PROJECT_SLUG=${SENTRY_PROJECT_SLUG:-}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
      - milimo-mesh:/sandbox/.openclaw/milimo/mesh
    command: >
      python3 /sandbox/.openclaw/milimo/blueprints/0.1.0/orchestrator/claw_launcher.py
      --role build
      --heartbeat-interval 30
      --poll-interval 5
      --verbose
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; p = os.path.expanduser('~/.openclaw/milimo/mesh/heartbeats/build.json'); assert os.path.exists(p), 'no heartbeat'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - milimo-network

  # ---------------------------------------------------------------------------
  # Content Claw — Content generation, scheduling, publishing
  # ---------------------------------------------------------------------------
  content-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-content-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
      - milimo-mesh:/sandbox/.openclaw/milimo/mesh
    command: >
      python3 /sandbox/.openclaw/milimo/blueprints/0.1.0/orchestrator/claw_launcher.py
      --role content
      --heartbeat-interval 30
      --poll-interval 5
      --verbose
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; p = os.path.expanduser('~/.openclaw/milimo/mesh/heartbeats/content.json'); assert os.path.exists(p), 'no heartbeat'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - milimo-network

  # ---------------------------------------------------------------------------
  # Ops Claw — Operations, incident management, client communication
  # ---------------------------------------------------------------------------
  ops-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-ops-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
      - milimo-mesh:/sandbox/.openclaw/milimo/mesh
    ports:
      - "8090:8080"
    command: >
      python3 /sandbox/.openclaw/milimo/blueprints/0.1.0/orchestrator/claw_launcher.py
      --role ops
      --heartbeat-interval 30
      --poll-interval 5
      --verbose
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; p = os.path.expanduser('~/.openclaw/milimo/mesh/heartbeats/ops.json'); assert os.path.exists(p), 'no heartbeat'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - milimo-network

  # ---------------------------------------------------------------------------
  # Analytics Claw — Platform analytics, performance monitoring
  # ---------------------------------------------------------------------------
  analytics-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-analytics-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_CHANNEL_ID=${YOUTUBE_CHANNEL_ID}
      - GA_PROPERTY_ID=${GA_PROPERTY_ID}
      - GA_CREDENTIALS_PATH=${GA_CREDENTIALS_PATH}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
      - milimo-mesh:/sandbox/.openclaw/milimo/mesh
    command: >
      python3 /sandbox/.openclaw/milimo/blueprints/0.1.0/orchestrator/claw_launcher.py
      --role analytics
      --heartbeat-interval 30
      --poll-interval 5
      --verbose
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; p = os.path.expanduser('~/.openclaw/milimo/mesh/heartbeats/analytics.json'); assert os.path.exists(p), 'no heartbeat'"]
      interval: 60s
