      retries: 3
      start_period: 30s
    networks:
      - milimo-network

  # ---------------------------------------------------------------------------
  # Finance Claw — Payments, invoicing, financial reporting
  # ---------------------------------------------------------------------------
  finance-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-finance-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
