  # ---------------------------------------------------------------------------
  # Assistant Claw — Lucy, the conversational coordinator (Telegram bridge)
  # ---------------------------------------------------------------------------
  assistant-claw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milimo-assistant-claw
    restart: unless-stopped
    <<: *security
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - NEMOCLAW_MODEL=${NEMOCLAW_MODEL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ID=${TELEGRAM_ID}
      - SQUAD_ID=${SQUAD_ID:-zulu}
      - PYTHONUNBUFFERED=1
    volumes:
      - milimo-mesh:/sandbox/.openclaw/milimo/mesh
    command: >
      python3 /sandbox/.openclaw/milimo/blueprints/0.1.0/orchestrator/claw_launcher.py
      --role assistant
      --heartbeat-interval 30
      --poll-interval 5
      --verbose
