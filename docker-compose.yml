# ---------------------------------------------------------------------------
# Volumes — Persistent data across container restarts
# ---------------------------------------------------------------------------
volumes:
  milimo-mesh: # Shared mesh (heartbeats, inboxes, topology)

# ---------------------------------------------------------------------------
# Network — Shared network for inter-claw communication
# ---------------------------------------------------------------------------
networks:
  milimo-network:
    driver: bridge
