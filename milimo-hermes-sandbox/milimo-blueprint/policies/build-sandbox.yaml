# Build Claw Sandbox Policy
# Mount: /sandbox/.openclaw-data/milimo/claws/build (read-write)

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /sandbox/.openclaw-data/milimo/claws/analytics/reports
  read_write:
  - /sandbox/.openclaw-data/milimo/claws/build
  - /tmp
  - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # ── Inference ───────────────────────────────────────────────────────
  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }

  # ── GitHub ──────────────────────────────────────────────────────────
  github_api:
    name: github_api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/git }
      - { path: /sandbox/.local/bin/gh }
      - { path: /usr/bin/python3 }

  # ── Deployment: Vercel ──────────────────────────────────────────────
  vercel_api:
    name: vercel_api
    endpoints:
      - host: api.vercel.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Deployment: Railway ─────────────────────────────────────────────
  railway_api:
    name: railway_api
    endpoints:
      - host: backboard.railway.app
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Package Registries ──────────────────────────────────────────────
  npm_registry:
    name: npm_registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/python3 }

  pypi_registry:
    name: pypi_registry
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Error Monitoring ────────────────────────────────────────────────
  sentry_api:
    name: sentry_api
    endpoints:
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/api/**" }
    binaries:
      - { path: /usr/bin/python3 }
