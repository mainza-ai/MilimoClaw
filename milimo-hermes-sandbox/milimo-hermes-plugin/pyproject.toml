[project]
name = "milimo-hermes-plugin"
version = "0.2.0"
description = "Hermes profile plugin for MilimoClaw"
requires-python = ">=3.11"
dependencies = [
    "milimo-core",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["milimo_hermes_plugin*"]

[tool.uv]
package = true
managed = true
