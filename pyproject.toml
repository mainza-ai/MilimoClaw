[project]
name = "milimo-claw-docs"
version = "0.1.0"
description = "Documentation build for Milimo Claw"
requires-python = ">=3.11"

[dependency-groups]
docs = [
    "sphinx<=7.5",
    "myst-parser<=5",
    "sphinx-copybutton<=0.6",
    "sphinx-design",
    "sphinx-autobuild",
    "sphinxcontrib-mermaid",
    "sphinx-llm>=0.3.0",
]

[tool.uv]
package = false
managed = true

[tool.uv.workspace]
members = [
    "milimo-core",
    "milimo-blueprint",
    "milimo-hermes-plugin",
]
