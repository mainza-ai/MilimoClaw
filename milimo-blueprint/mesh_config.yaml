mesh_version: "0.1.0"

# Mesh encryption key — when set, all inter-claw messages are encrypted with AES-256-GCM.
# Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# Leave empty to disable encryption (messages stored as plaintext JSON).
mesh_secret: ""

message_matrix:
  content:
    ops: [deliverable, deliverable_complete]
    analytics: [query, content_performance_query, performance_signal]
    war_room: [draft_ready]
    assistant: [assistant_response]
  ops:
    content: [brief, project_brief, revision_request]
    finance: [query, pricing_query, project_complete]
    build: [brief, feature_brief]
    analytics: [client_onboarded]
    war_room: [signal, deliverable]
    assistant: [assistant_response]
  analytics:
    content: [response, summary, performance_intel, client_health_signal]
    ops: [signal, client_health_signal_ops]
    finance: [summary, revenue_anomaly]
    build: [response, signal, retention_signals]
    war_room: [signal, summary]
    assistant: [assistant_response]
  finance:
    ops: [response, signal, pricing_response, invoice_ready]
    analytics: [summary, revenue_summary]
    war_room: [signal, deliverable, finance_summary, overdue_alert]
    assistant: [assistant_response]
  build:
    ops: [signal, deliverable, deploy_complete]
    analytics: [query, behavior_query]
    content: [summary, shipping_summary]
    war_room: [signal, deliverable, tool_proposal]
    assistant: [assistant_response]
  assistant:
    content: [assistant_query, assistant_task]
    ops: [assistant_query, assistant_task]
    analytics: [assistant_query, assistant_task]
    finance: [assistant_query, assistant_task]
    build: [assistant_query, assistant_task]
    war_room: [assistant_response]

message_types:
  brief:
    description: "Project or creative brief"
    requires_approval: false
  project_brief:
    description: "Project brief from Ops to Content"
    requires_approval: false
  query:
    description: "Data request"
    requires_approval: false
  response:
    description: "Query response with requested data"
    requires_approval: false
  signal:
    description: "Alert — deadline, risk, anomaly, completion"
    requires_approval: false
  deliverable:
    description: "Completed work product queued for review"
    requires_approval: true
  summary:
    description: "Periodic report — weekly intelligence, revenue, shipping"
    requires_approval: false
  finance_summary:
    description: "Revenue summary for War Room widget"
    requires_approval: false
  draft_ready:
    description: "Content draft ready for War Room review"
    requires_approval: true
  performance_intel:
    description: "Weekly performance intelligence from Analytics"
    requires_approval: false
  retention_signals:
    description: "Feature retention signals from Analytics to Build"
    requires_approval: false
  client_health_signal:
    description: "Client satisfaction alert from Analytics to Ops"
    requires_approval: false
  revenue_anomaly:
    description: "Revenue anomaly detected by Analytics"
    requires_approval: false
  pricing_query:
    description: "Pricing request from Ops to Finance"
    requires_approval: false
  pricing_response:
    description: "Pricing bounds from Finance to Ops"
    requires_approval: false
  invoice_ready:
    description: "Invoice ready for War Room approval"
    requires_approval: true
  overdue_alert:
    description: "Payment overdue alert to War Room"
    requires_approval: false
  feature_brief:
    description: "Feature request from Ops to Build"
    requires_approval: false
  deploy_complete:
    description: "Deployment completion signal from Build"
    requires_approval: false
  shipping_summary:
    description: "Weekly shipping summary for devlog"
    requires_approval: false
  behavior_query:
    description: "User behavior query from Build to Analytics"
    requires_approval: false
  tool_proposal:
    description: "Evolution-generated tool proposal"
    requires_approval: true
  revision_request:
    description: "Content revision request"
    requires_approval: false
  content_performance_query:
    description: "Content performance query to Analytics"
    requires_approval: false
  performance_signal:
    description: "Post-publish performance signal"
    requires_approval: false
  deliverable_complete:
    description: "Deliverable completion signal to Ops"
    requires_approval: false
  project_complete:
    description: "Project completion signal to Finance"
    requires_approval: false
  client_onboarded:
    description: "New client onboarded signal to Analytics"
    requires_approval: false
  revenue_summary:
    description: "Weekly revenue summary from Finance to Analytics"
    requires_approval: false
  client_health_signal_ops:
    description: "Client health signal from Analytics to Ops"
    requires_approval: false
  assistant_query:
    description: "Assistant query to a claw (read-only status request)"
    requires_approval: false
  assistant_task:
    description: "Assistant task assignment to a claw (requires operator approval)"
    requires_approval: false
  assistant_response:
    description: "Claw response back to assistant via War Room"
    requires_approval: false

escalation_rules:
  - trigger: "invoice_over_500"
    action: veto
    description: "Any invoice >$500 requires squad-wide approval"
  - trigger: "client_offboarding"
    action: hold
    description: "Client offboarding requires explicit squad confirmation"
  - trigger: "brand_voice_change"
    action: hold
    description: "Brand voice modifications require explicit confirmation"
  - trigger: "payment_execution"
    action: veto
    description: "Any payment execution requires squad-wide approval"
  - trigger: "rate_change"
    action: veto
    description: "Pricing rate changes require squad-wide approval"
  - trigger: "external_data_sharing"
    action: veto
    description: "Sharing squad data externally requires squad-wide approval"

health_check:
  interval_seconds: 30
  timeout_seconds: 10
  unhealthy_threshold: 3
  recovery_action: notify_war_room
