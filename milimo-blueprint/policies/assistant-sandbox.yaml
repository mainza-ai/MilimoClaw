# Assistant Sandbox Policy
# For the main conversational assistant (Lucy) that bridges to all claws.
# Mount: /sandbox (full read access, limited write)
# Network: All external APIs needed for assistant operations.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /sandbox/.openclaw-data/milimo/claws/analytics/reports
  - /sandbox/.openclaw-data/milimo/claws/ops
  - /sandbox/.openclaw-data/milimo/claws/content/drafts
  - /sandbox/.openclaw-data/milimo/claws/finance/revenue
  - /sandbox/.openclaw-data/milimo/claws/build/prs
  read_write:
  - /sandbox/.openclaw-data/milimo
  - /sandbox/.openclaw
  - /sandbox/.local
  - /tmp
  - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # ── Inference (NVIDIA NIM) ───────────────────────────────────────────
  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }

  # ── GitHub API ───────────────────────────────────────────────────────
  github_api:
    name: github_api
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      enforcement: enforce
      tls: terminate
      rules:
      - allow: { method: "*", path: "/**" }
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      tls: terminate
      rules:
      - allow: { method: GET, path: "/**" }
      - allow: { method: POST, path: "/**" }
    binaries:
    - { path: /usr/bin/gh }
    - { path: /usr/bin/git }
    - { path: /sandbox/.local/bin/gh }
    - { path: /usr/local/bin/node }
    - { path: /usr/bin/python3 }

  # ── Deployment: Vercel ───────────────────────────────────────────────
  vercel_api:
    name: vercel_api
    endpoints:
      - host: api.vercel.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Error Monitoring: Sentry ─────────────────────────────────────────
  sentry_api:
    name: sentry_api
    endpoints:
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/api/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Payments: Stripe ─────────────────────────────────────────────────
  stripe_api:
    name: stripe_api
    endpoints:
      - host: api.stripe.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }

  # ── Messaging: Telegram Bot API ──────────────────────────────────────
  telegram_api:
    name: telegram_api
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }

  # ── Package Registries ───────────────────────────────────────────────
  npm_registry:
    name: npm_registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/python3 }

  pypi_registry:
    name: pypi_registry
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }
