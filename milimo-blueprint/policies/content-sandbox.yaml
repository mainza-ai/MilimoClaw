# Content Claw Sandbox Policy
# Extends the base OpenClaw sandbox policy with Content-specific
# filesystem and network constraints.
#
# Mount: /sandbox/content (read-write)
# Cross: /sandbox/analytics/reports (read-only)

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /sandbox/analytics/reports   # Cross-mount: Analytics weekly reports
  read_write:
    - /sandbox/content             # Primary mount
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # ── Inference (mandatory base) ──────────────────────────────────────
  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }

  # ── Social Publishing APIs ──────────────────────────────────────────
  instagram_api:
    name: instagram_api
    endpoints:
      - host: graph.instagram.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/**/media" }
          - allow: { method: POST, path: "/**/media_publish" }
          - allow: { method: GET, path: "/**/insights" }

  twitter_api:
    name: twitter_api
    endpoints:
      - host: api.twitter.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/2/tweets" }
          - allow: { method: GET, path: "/2/tweets/**" }

  linkedin_api:
    name: linkedin_api
    endpoints:
      - host: api.linkedin.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/v2/ugcPosts" }
          - allow: { method: GET, path: "/v2/**" }

  tiktok_api:
    name: tiktok_api
    endpoints:
      - host: open.tiktokapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/v2/post/publish/**" }

  # ── Stock Assets & SEO ──────────────────────────────────────────────
  unsplash_api:
    name: unsplash_api
    endpoints:
      - host: api.unsplash.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }

  pexels_api:
    name: pexels_api
    endpoints:
      - host: api.pexels.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
