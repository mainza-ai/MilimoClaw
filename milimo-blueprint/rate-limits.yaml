# ═══════════════════════════════════════════════════════════════════════
# Milimo Claw — Rate Limit Configuration
# ═══════════════════════════════════════════════════════════════════════
# Defines auto-approval rate limits by tier.
# Free tier has strict limits to encourage upgrade.
# Pro tier has no limits.

version: "1.0"

# ── Tier Definitions ────────────────────────────────────────────────────

tiers:
  free:
    description: "Free tier for individuals and small squads"
    auto_approvals:
      daily_limit: 10
      burst_limit: 3
      burst_window_hours: 1
    features:
      - "Basic squad mesh"
      - "Self-evolution (max 5 tools)"
      - "Blueprint marketplace (view only)"

  pro:
    description: "Professional tier for growing squads"
    auto_approvals:
      daily_limit: null  # Unlimited
      burst_limit: null  # Unlimited
      burst_window_hours: null
    features:
      - "Full squad mesh"
      - "Unlimited self-evolution"
      - "Blueprint marketplace (buy/sell)"
      - "Priority War Room support"
      - "Mobile app access"

  university:
    description: "University partnership tier"
    auto_approvals:
      daily_limit: 50
      burst_limit: 10
      burst_window_hours: 1
    features:
      - "Full squad mesh"
      - "Self-evolution (max 30 tools)"
      - "Blueprint marketplace (view only)"
      - "Cohort management"

# ── Escalation Rules ────────────────────────────────────────────────────
# Actions that always require manual approval regardless of tier

always_require_approval:
  - trigger: "invoice_over_500"
    description: "Any invoice >$500"

  - trigger: "client_offboarding"
    description: "Client offboarding"

  - trigger: "brand_voice_change"
    description: "Brand voice modifications"

  - trigger: "payment_execution"
    description: "Payment execution"

  - trigger: "rate_change"
    description: "Pricing rate changes"

  - trigger: "external_data_sharing"
    description: "Sharing squad data externally"

# ── Auto-Approval Rules ─────────────────────────────────────────────────
# Actions that can be auto-approved (subject to rate limits)

auto_approvable:
  - trigger: "social_post_draft"
    description: "Social media draft approval"

  - trigger: "internal_draft"
    description: "Internal draft approval"

  - trigger: "task_completion"
    description: "Task completion confirmation"

  - trigger: "routine_report"
    description: "Weekly routine reports"

# ── Rate Limit Behavior ─────────────────────────────────────────────────

behavior:
  # What happens when rate limit is hit
  on_limit_exceeded:
    action: "require_manual_approval"
    message: "Daily auto-approval limit reached. Manual approval required."

  # Notification settings
  notifications:
    warn_at_remaining: 3
    notify_on_limit: true
    notify_admin: true

  # Reset schedule
  reset:
    timezone: "UTC"
    daily_reset_hour: 0  # Midnight UTC

# ── Monitoring ──────────────────────────────────────────────────────────

monitoring:
  # Track metrics for dashboard
  metrics:
    - "total_requests"
    - "allowed_requests"
    - "denied_requests"
    - "current_remaining"
    - "utilization_percent"

  # Alert thresholds
  alerts:
    high_utilization:
      threshold: 80
      severity: "warning"

    limit_reached:
      threshold: 100
      severity: "info"
