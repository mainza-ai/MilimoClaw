[project]
name = "milimo-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "stripe>=5.0",
    "sentry-sdk>=1.0",
    "websocket-client>=1.0",
    "cryptography>=41.0",
    "httpx>=0.24",
]

[tool.pyright]
include = ["orchestrator", "tests", "test_marketplace.py"]
extraPaths = [".", "orchestrator"]
reportMissingImports = true
reportMissingModuleSource = false
pythonVersion = "3.11"

[tool.ruff.lint]
ignore = ["E402"]
