[project]
name = "milimo-blueprint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "stripe>=5.0",
    "sentry-sdk>=1.0",
    "websocket-client>=1.0",
    "cryptography>=41.0",
    "httpx>=0.24",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

[tool.pyright]
include = ["orchestrator", "tests", "test_marketplace.py"]
extraPaths = [".", "orchestrator"]
reportMissingImports = true
reportMissingModuleSource = false
pythonVersion = "3.11"

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "phase_a: Phase A isolation tests",
    "phase_b: Phase B warroom tests",
]
filterwarnings = [
    "ignore:orchestrator\\..*is deprecated; use milimo_core:DeprecationWarning",
]
