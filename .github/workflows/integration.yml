name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            milimo/package-lock.json
            package-lock.json

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio requests stripe sentry-sdk websocket-client cryptography httpx

      - name: Install Node.js dependencies
        run: |
          npm ci
          cd milimo && npm ci

      - name: Build TypeScript
        run: |
          cd milimo && npm run build

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: |
          cd test/integration
          node --test blueprint-manager.test.js
          node --test mesh-coordinator.test.js
        env:
          CI: true
          MILIMO_TEST_MODE: true

      - name: Run Python tests
        run: |
          cd milimo-blueprint
          PYTHONPATH=$(pwd)/orchestrator:$(pwd)/../milimo-core/src python -m pytest tests/ -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: |
            test-results/
            coverage/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm ci
          cd milimo && npm ci

      - name: Run TypeScript check
        run: |
          cd milimo && npx tsc --noEmit

      - name: Run Python lint
        run: |
          pip install ruff
          ruff check milimo-blueprint/orchestrator/ --output-format=github

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report only — transitive deps from openclaw)
        run: |
          echo "=== npm audit report ==="
          npm audit --audit-level=high || true
          echo ""
          echo "=== Checking for direct dependency vulnerabilities ==="
          # All current vulns are transitive (from openclaw, @aws-sdk, etc.)
          # openclaw is flagged as "direct" but only because it contains transitive vulns
          npm audit --json 2>/dev/null > /tmp/audit.json || true
          DIRECT_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/audit.json')); print(len([n for n,v in d.get('vulnerabilities',{}).items() if v.get('isDirect') and n != 'openclaw']))")
          echo "Direct dependency vulnerabilities (excluding openclaw): $DIRECT_COUNT"
          if [ "$DIRECT_COUNT" -gt 0 ]; then
            echo "FAIL: Direct dependency vulnerabilities found"
            exit 1
          fi
          echo "PASS: No direct dependency vulnerabilities"

      - name: Run Python security check
        run: |
          pip install bandit
          bandit -r milimo-blueprint/orchestrator/ -ll -s B104,B108,B310,B324,B602
