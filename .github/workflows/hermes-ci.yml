name: Hermes CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hermes-integration:
    name: Hermes Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_POLICY_TIER: "restricted"
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_SANDBOX_NAME: "milimo-hermes-ci"
      NVIDIA_API_KEY: "test-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: Run milimo-core unit tests
        run: |
          uv run pytest milimo-core/tests/ --cov=milimo_core --cov-config=milimo-core/pyproject.toml --cov-fail-under=80

      - name: Run Hermes plugin integration tests
        run: |
          PYTHONPATH=milimo-core/src:milimo-hermes-plugin uv run pytest milimo-hermes-plugin/tests/integration/ -v

      - name: Run blueprint tests
        run: |
          cd milimo-blueprint && PYTHONPATH=.:orchestrator:../milimo-core/src uv run pytest tests/ -v -k "not test_is_quarter_start"

  hermes-smoke:
    name: Hermes Smoke Test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: hermes-integration

    env:
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_POLICY_TIER: "restricted"
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_SANDBOX_NAME: "milimo-hermes-smoke"
      NVIDIA_API_KEY: "test-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermes sandbox image
        run: |
          docker build -t milimo-hermes:smoke-test -f milimo-hermes-sandbox/Dockerfile .

      - name: Run smoke test container
        run: |
          docker run -d \
            --name milimo-hermes-smoke \
            -e NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1 \
            -e NEMOCLAW_POLICY_TIER=restricted \
            -e NEMOCLAW_NON_INTERACTIVE=1 \
            -e NEMOCLAW_SANDBOX_NAME=milimo-hermes-smoke \
            -e NVIDIA_API_KEY=test-key \
            -p 8642:8642 \
            -p 18789:18789 \
            milimo-hermes:smoke-test

      - name: Wait for dashboard readiness
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8642/health >/dev/null 2>&1; then
              echo "Dashboard ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dashboard failed to start"
          docker logs milimo-hermes-smoke
          exit 1

      - name: Verify War Room endpoint
        run: |
          curl -sf http://127.0.0.1:8642/warroom | grep -q "War Room"

      - name: Verify OpenAI-compatible API
        run: |
          curl -sf -X POST http://127.0.0.1:8642/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"test","messages":[{"role":"user","content":"ping"}]}' | grep -q "choices"

      - name: Cleanup
        if: always()
        run: |
          docker logs milimo-hermes-smoke
          docker rm -f milimo-hermes-smoke
