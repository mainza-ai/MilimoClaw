name: Hermes CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'milimo-hermes-sandbox/**'
      - 'milimo-hermes-plugin/**'
      - 'milimo-core/**'
      - '.github/workflows/hermes-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'milimo-hermes-sandbox/**'
      - 'milimo-hermes-plugin/**'
      - 'milimo-core/**'
      - '.github/workflows/hermes-ci.yml'
  workflow_dispatch:

jobs:
  hermes-integration:
    name: Hermes Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_POLICY_TIER: "restricted"
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_SANDBOX_NAME: "milimo-hermes-ci"
      NVIDIA_API_KEY: "test-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio pytest-mock faker pyyaml requests stripe sentry-sdk websocket-client cryptography httpx

      - name: Install milimo-core
        run: pip install -e milimo-core

      - name: Run milimo-core unit tests
        run: |
          cd milimo-core && python -m pytest tests/ --cov=milimo_core --cov-config=pyproject.toml --cov-fail-under=80

      - name: Run Hermes plugin integration tests
        run: |
          python -m pytest milimo-hermes-plugin/tests/integration/ -v

      - name: Run blueprint tests
        run: |
          pip install -e milimo-blueprint
          cd milimo-blueprint && PYTHONPATH=/home/runner/work/MilimoClaw/MilimoClaw/milimo-core/src:/home/runner/work/MilimoClaw/MilimoClaw/milimo-blueprint/orchestrator python -m pytest tests/ -v -k "not test_is_quarter_start"

  hermes-smoke:
    name: Hermes Smoke Test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Hermes base image layer
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: hermes-base-${{ runner.os }}-${{ hashFiles('milimo-hermes-sandbox/Dockerfile') }}
          restore-keys: |
            hermes-base-${{ runner.os }}-

      - name: Resolve Hermes base image
        id: resolve-base
        run: |
          BASE_IMAGE="ghcr.io/nvidia/nemoclaw/hermes-sandbox-base:latest"
          if docker pull "${BASE_IMAGE}" 2>/dev/null; then
            DIGEST=$(docker inspect "${BASE_IMAGE}" --format '{{index .RepoDigests 0}}')
            echo "image=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "source=pulled" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not pull NVIDIA Hermes sandbox base image."
            echo "This is a public image - check network connectivity."
            exit 1
          fi

      - name: Log base image source
        run: |
          echo "Base image: ${{ steps.resolve-base.outputs.image }}"
          echo "Source: ${{ steps.resolve-base.outputs.source }}"

      - name: Build Milimo Hermes sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: milimo-hermes-sandbox/Dockerfile
          push: false
          load: true
          tags: milimo-hermes-sandbox:ci
          build-args: |
            BASE_IMAGE=${{ steps.resolve-base.outputs.image }}
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Hermes smoke test
        id: smoke
        run: |
          docker run \
            --name milimo-hermes-smoke \
            --rm \
            --detach \
            --env HERMES_NON_INTERACTIVE=1 \
            --env NEMOCLAW_NON_INTERACTIVE=1 \
            --env NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1 \
            --env NEMOCLAW_POLICY_TIER=restricted \
            --env NEMOCLAW_SANDBOX_NAME=milimo-hermes-ci \
            milimo-hermes-sandbox:ci \
            sleep infinity

          # Wait for s6 supervision tree to initialise (stage2-hook)
          sleep 5

          # Verify Milimo install stamp is present
          docker exec milimo-hermes-smoke \
            test -f /opt/hermes/.milimo_install \
            && echo "✓ Milimo install stamp present"

          # Verify plugin directory exists
          docker exec milimo-hermes-smoke \
            test -d /sandbox/.hermes/plugins/milimo-hermes \
            && echo "✓ Plugin directory present"

          # Verify milimo-core importable in Hermes venv
          docker exec milimo-hermes-smoke \
            /opt/hermes/.venv/bin/python -c \
            "from milimo_core.protocols.delegation import DelegationAdapter, ClawTask; print('✓ milimo-core importable')"

          # Verify milimo_hermes_plugin importable
          docker exec milimo-hermes-smoke \
            /opt/hermes/.venv/bin/python -c \
            "import milimo_hermes_plugin; print('✓ milimo_hermes_plugin importable')"

          # Verify War Room assets present
          docker exec milimo-hermes-smoke \
            test -d /opt/hermes/warroom \
            && echo "✓ War Room assets present"

      - name: Cleanup
        if: always()
        run: |
          docker logs milimo-hermes-smoke 2>/dev/null || true
          docker stop milimo-hermes-smoke 2>/dev/null || true
          docker rm -f milimo-hermes-smoke 2>/dev/null || true
          docker rmi milimo-hermes-sandbox:ci 2>/dev/null || true
